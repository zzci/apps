services:
  app:
    image: zzci/station
    container_name: station
    hostname: station
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./work:/work
      - ./root:/root
      - /app:/app
    networks:
      - traefik

networks:
  traefik:
    external: true
