global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true

log:
  level: error
  filePath: /data/logs/traefik.log

accessLog:
  filePath: /dev/null

entryPoints:
  http:
    address: :80
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: :443
    forwardedHeaders:
      insecure: false

experimental:
  localPlugins:
    oidc:
      moduleName: github.com/sevensolutions/traefik-oidc-auth
    realIp:
      moduleName: github.com/Paxxs/traefik-get-real-ip

certificatesResolvers:
  default:
    acme:
      httpChallenge:
        entryPoint: http
      storage: /data/ssl/default.json
  dns:
    acme:
      dnsChallenge:
        provider: acme-dns
        resolvers:
          - 1.1.1.1:53
          - 8.8.8.8:53
      storage: /data/ssl/dns.json

providers:
  file:
    directory: /services
    watch: true
